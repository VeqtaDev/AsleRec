name: Installeur Windows

# Produit AsleRec-Setup-<version>.exe. La compilation doit avoir lieu sous
# Windows : electron-builder utilise rcedit pour poser l'icône et les
# métadonnées de l'exécutable, ce qui n'est pas reproductible sur Linux.
on:
  push:
    branches: [main, claude/dapp-pc-idea-nfdeez]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      - name: Construire l'installeur
        run: npm run dist
        env:
          # Aucune signature de code : le certificat n'est pas dans le dépôt.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: AsleRec-Setup
          path: release/*/AsleRec-Setup-*.exe
          if-no-files-found: error

      # Déclenchement manuel accepté en plus des tags : le tag est alors déduit
      # de la version du package.json et créé par `gh release create` lui-même.
      - name: Créer la release et y joindre l'installeur
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi

          installer=$(find release -name 'AsleRec-Setup-*.exe' | head -n 1)
          echo "Tag : $tag — installeur : $installer"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$installer" --clobber
          else
            gh release create "$tag" "$installer" \
              --target "${GITHUB_SHA}" \
              --title "AsleRec $tag" \
              --notes-file .github/release-notes.md
          fi
