name: Installeur Windows

# Produit AsleRec-Setup-<version>.exe. La compilation doit avoir lieu sous
# Windows : electron-builder utilise rcedit pour poser l'icône et les
# métadonnées de l'exécutable, ce qui n'est pas reproductible sur Linux.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      - name: Construire l'installeur
        run: npm run dist
        env:
          # Aucune signature de code : le certificat n'est pas dans le dépôt.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: AsleRec-Setup
          path: release/*/AsleRec-Setup-*.exe
          if-no-files-found: error

      - name: Joindre l'installeur à la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*/AsleRec-Setup-*.exe
