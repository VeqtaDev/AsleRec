name: Installeur Windows

# Produit AsleRec-Setup-<version>.exe. La compilation doit avoir lieu sous
# Windows : electron-builder utilise rcedit pour poser l'icône et les
# métadonnées de l'exécutable, ce qui n'est pas reproductible sur Linux.
on:
  push:
    branches: [main, claude/dapp-pc-idea-nfdeez]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      - name: Construire l'installeur
        run: npm run dist
        env:
          # Aucune signature de code : le certificat n'est pas dans le dépôt.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: AsleRec-Setup
          path: release/*/AsleRec-Setup-*.exe
          if-no-files-found: error

      - name: Créer la release et y joindre l'installeur
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          installer=$(find release -name 'AsleRec-Setup-*.exe' | head -n 1)
          echo "Installeur trouvé : $installer"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$installer" --clobber
          else
            gh release create "$tag" "$installer" \
              --title "AsleRec $tag" \
              --notes-file .github/release-notes.md
          fi
