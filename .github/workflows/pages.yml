name: Site de documentation

# Publie le contenu de docs/ sur GitHub Pages.
on:
  push:
    branches: [main, claude/dapp-pc-idea-nfdeez]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; les suivantes attendent leur tour.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          # Active Pages sur le dépôt si ce n'est pas déjà fait.
          enablement: true

      - name: Préparer l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
